<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>午夜来信：第十三位访客 · 氛围增强版</title>

<style>:root{--face:#c0c0c0;--light:#fff;--shadow:#808080;--dark:#404040;--navy:#000080;--teal:#008080;--ink:#111;--system-font:Tahoma,"宋体",SimSun,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1c1b1e;color:var(--ink);font-family:var(--system-font);font-size:12px;cursor:default}
body{background:radial-gradient(ellipse at 50% 35%,#3a3637 0,#242326 49%,#121215 100%)}
button,input,textarea,select{font:inherit;color:inherit;border-radius:0}
button{cursor:default;user-select:none;touch-action:manipulation;background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;padding:4px 10px;min-height:25px}
button:active,button.pressed{border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px #808080;padding-top:5px;padding-bottom:3px}
button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
button:disabled{color:#808080;text-shadow:1px 1px #fff}
input,textarea{cursor:text;user-select:text;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #000;padding:5px 6px;min-height:27px}
input:focus,textarea:focus{outline:1px dotted #000;outline-offset:1px}
input::selection,textarea::selection,.window-content ::selection{background:var(--navy);color:#fff}
a{color:var(--navy);cursor:default}
svg{display:block;flex:none;shape-rendering:crispEdges}
.hidden{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%)}
.room{min-height:100svh;padding:24px 28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none}
.monitor{width:min(1130px,100%);position:relative;background:linear-gradient(100deg,#aca68e,#d7ceb2 8%,#dad2b9 50%,#b6ae96 100%);border:2px solid;border-color:#e7e0cc #8b826d #7b7261 #ddd4ba;border-radius:15px 15px 12px 12px;padding:12px 13px 0;box-shadow:0 16px 40px #0008,4px 2px 0 #746d5b,-4px 1px 0 #8b836e}
.bezel{position:relative;padding:26px 29px 31px;background:linear-gradient(130deg,#d5cdb6 10%,#c4bba1 50%,#dad2bd 100%);border:2px solid;border-color:#9c937b #efe7cf #efe7cf #9c937b;border-radius:11px;box-shadow:inset 3px 3px 7px #7169536b,inset -3px -3px 6px #fff6}
#screen{position:relative;isolation:isolate;width:100%;height:min(68vh,655px);min-height:410px;overflow:hidden;background:var(--teal);border:7px solid #171717;border-radius:6px;box-shadow:0 0 0 3px #6a6557,inset 0 0 35px #002f2f80;color:#111;cursor:default}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:10000;background:repeating-linear-gradient(0deg,#00000006 0,#00000006 1px,transparent 1px,transparent 3px);box-shadow:inset 0 0 20px #0005}
.monitor-brand{display:inline-block;margin:15px 0 18px 27px;font:bold 13px Tahoma,sans-serif;letter-spacing:2.5px;color:#595849;text-shadow:1px 1px #fff7;line-height:19px}
.vents{position:absolute;bottom:23px;left:43%;width:19%;height:13px;background:repeating-linear-gradient(90deg,#77715f 0,#77715f 2px,#c6bca3 2px,#c6bca3 6px);border-bottom:1px solid #eee4c9;opacity:.75}
.power{position:absolute;bottom:18px;right:41px;display:flex;align-items:center;gap:12px}
.led{display:block;width:7px;height:7px;background:#75e062;border:1px solid #3d6134;box-shadow:0 0 5px #7af165;flex:none}
.power-button{width:28px;height:23px;min-height:23px;padding:0;background:#b7ae96;border-color:#e9e0c8 #756d59 #756d59 #e9e0c8;box-shadow:inset -1px -1px #918974;color:#514f44;font-size:13px}
.power-button:active{padding:0;border-color:#756d59 #e9e0c8 #e9e0c8 #756d59}
.monitor::after{content:"";display:block;position:absolute;bottom:-16px;left:32%;width:36%;height:15px;background:linear-gradient(#9e967f,#c3baa2);border:1px solid #807663;border-radius:0 0 5px 5px;z-index:-1;box-shadow:0 8px 14px #0006}
#workspace{position:absolute;inset:0 0 33px;overflow:hidden}
.wallpaper{position:absolute;inset:0;background:linear-gradient(135deg,#007f80,#007575);pointer-events:none}
.os-mark{position:absolute;right:42px;bottom:40px;opacity:.17;color:#b3e5da;text-align:right;font-family:Tahoma,sans-serif;font-size:44px;font-weight:bold;line-height:1.2;letter-spacing:-2px}
.os-mark small{display:block;font-size:12px;font-weight:normal;letter-spacing:4px;margin-top:8px}
.os-mark svg{width:105px;height:105px;margin:0 0 12px auto}
#icons{position:absolute;inset:0;pointer-events:none}
.desk-icon{position:absolute;width:78px;min-height:75px;padding:5px 2px;background:none;border:0;box-shadow:none;color:#fff;text-shadow:1px 1px #003d3d;text-align:center;pointer-events:auto;display:flex;align-items:center;flex-direction:column;gap:5px;cursor:default;outline:none}
.desk-icon:active{padding:5px 2px;box-shadow:none;border:0}
.desk-icon svg{width:34px;height:34px}
.desk-icon .label{display:block;padding:2px 3px;max-width:76px;font-size:12px;line-height:16px;word-break:break-word;border:1px solid transparent}
.desk-icon.selected .label,.desk-icon[aria-selected="true"] .label,.desk-icon .label.selected{background:var(--navy);border:1px dotted #fff;text-shadow:none}
.desk-icon.selected svg,.desk-icon[aria-selected="true"] svg{filter:drop-shadow(1px 1px 0 #000080)}
.desk-icon:focus-visible{outline:none}
.desk-icon:focus-visible .label{border:1px dotted #fff}
#windows{position:absolute;inset:0;pointer-events:none}
.window{position:absolute;display:flex;flex-direction:column;min-width:230px;min-height:150px;padding:3px;background:var(--face);border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;box-shadow:inset 1px 1px #fff,inset -1px -1px #808080,2px 2px 0 #0004;pointer-events:auto;overflow:hidden}
.titlebar{height:25px;min-height:25px;background:#808080;color:#c0c0c0;display:flex;align-items:center;gap:5px;padding:2px 3px;font-weight:bold;user-select:none;cursor:default;touch-action:none}
.window.active>.titlebar,.dialog>.titlebar,.titlebar.active{background:var(--navy);color:#fff}
.title-icon{display:flex;align-items:center;flex:none}
.title-icon svg{width:17px;height:17px}
.titletext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.win-controls{display:flex;gap:2px;align-items:center;flex:none}
.win-controls button{width:21px;height:19px;min-height:19px;padding:0;display:flex;align-items:center;justify-content:center;color:#000;line-height:12px;font:bold 12px Tahoma,sans-serif;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf}
.win-controls button:active{padding:1px 0 0 1px;box-shadow:inset 1px 1px #808080}
.win-controls button svg{width:10px;height:10px}
.win-controls button:last-child{margin-left:2px}
.menu{height:26px;min-height:26px;display:flex;align-items:center;gap:1px;padding:1px 2px;border-bottom:1px solid #808080;box-shadow:0 1px #fff}
.menu button{height:22px;min-height:22px;line-height:19px;border:1px solid transparent;background:transparent;box-shadow:none;padding:0 7px;white-space:nowrap}
.menu button:hover{border-color:#fff #808080 #808080 #fff}
.menu button:active{padding:0 7px;border-color:#808080 #fff #fff #808080}
.menu button:disabled:hover{border-color:transparent}
.toolbar{display:flex;align-items:center;gap:4px;min-height:36px;padding:5px 4px;border-bottom:1px solid #808080;box-shadow:0 1px #fff;flex-wrap:wrap}
.toolbar button{display:flex;align-items:center;gap:5px;height:26px;min-height:26px;white-space:nowrap;padding:2px 7px}
.toolbar button:active{padding:3px 6px 1px 8px}
.toolbar button svg,.toolbar .small-icon{width:18px;height:18px;flex:none}
.toolbar .separator{align-self:stretch;width:2px;min-height:20px;margin:0 3px;background:linear-gradient(90deg,#808080 50%,#fff 50%)}
.window-content{flex:1;min-height:0;overflow:auto;user-select:text;overscroll-behavior:contain}
.window-content button,.window-content .file-item{user-select:none}
.statusbar{display:flex;align-items:center;gap:3px;height:22px;min-height:22px;margin-top:3px;padding-right:13px;user-select:none}
.statusbar span{display:block;flex:1;min-width:0;height:20px;line-height:16px;padding:1px 5px;border:1px solid;border-color:#808080 #fff #fff #808080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar span+span{flex:0 0 auto;min-width:85px}
.resize-grip{position:absolute;right:4px;bottom:4px;width:13px;height:13px;background:repeating-linear-gradient(135deg,transparent 0,transparent 2px,#808080 2px,#808080 3px,#fff 3px,#fff 4px);clip-path:polygon(100% 0,100% 100%,0 100%);cursor:nwse-resize;touch-action:none}
.window.maximized .resize-grip{display:none}
.inset{border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #000;background:#fff}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:33px;background:var(--face);border-top:2px solid #fff;box-shadow:0 -1px #c0c0c0;display:flex;align-items:center;gap:5px;padding:3px 3px 3px 4px;z-index:900;user-select:none}
#start-button{height:25px;min-height:25px;padding:1px 7px;display:flex;align-items:center;gap:5px;font-weight:bold;flex:none}
#start-button svg{width:19px;height:19px}
#start-button:active,#start-button.active{padding:2px 6px 0 8px;border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px #808080;background:#bcbcbc}
.task-divider{height:24px;width:3px;background:linear-gradient(90deg,#808080 0,#808080 1px,#fff 1px,#fff 2px,transparent 2px);margin:0 1px;flex:none}
#tasks,.tasks{display:flex;gap:3px;align-items:center;flex:1;min-width:0;overflow:hidden;height:25px}
.task{display:flex;align-items:center;gap:4px;height:25px;min-height:25px;padding:2px 6px;text-align:left;flex:0 1 155px;min-width:38px;overflow:hidden;white-space:nowrap}
.task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task svg{width:17px;height:17px;flex:none}
.task.active{font-weight:bold;background:repeating-linear-gradient(45deg,#dfdfdf 0,#dfdfdf 1px,#c0c0c0 1px,#c0c0c0 2px);border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px #808080}
.task:active{padding:3px 5px 1px 7px}
#tray{height:25px;min-width:113px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:1px 6px;border:1px solid;border-color:#808080 #fff #fff #808080;flex:none}
#tray-mail,#sound-button{display:flex;align-items:center;justify-content:center;padding:0;width:18px;height:19px;min-height:19px;background:transparent;border:0;box-shadow:none}
#tray-mail svg,#sound-button svg{width:17px;height:17px}
#tray-mail:active,#sound-button:active{padding:0;box-shadow:none}
.clock{min-width:38px;font:12px Tahoma,sans-serif;text-align:center;white-space:nowrap}
.start-menu{position:absolute;left:3px;bottom:33px;width:224px;padding:3px;display:flex;background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 #0007;z-index:1100;user-select:none}
.start-strip{width:27px;flex:none;background:#808080;color:#c0c0c0;font:bold 20px Tahoma,sans-serif;writing-mode:vertical-rl;transform:rotate(180deg);padding:12px 3px;letter-spacing:1px;text-align:left}
.start-items{flex:1;min-width:0;padding:2px}
.start-items button{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;border:0;box-shadow:none;background:transparent;text-align:left;padding:5px 9px;white-space:nowrap}
.start-items button:hover,.start-items button:focus-visible{background:var(--navy);color:#fff;outline:none}
.start-items button:active{padding:5px 9px}
.start-items button svg{width:26px;height:26px}
.start-items hr,.context-menu hr{height:2px;border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:4px 0}
.context-menu{position:absolute;width:175px;padding:3px;background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 #0007;z-index:1200;user-select:none}
.context-menu button{display:block;text-align:left;width:100%;min-height:24px;box-shadow:none;border:0;background:transparent;padding:4px 16px}
.context-menu button:hover,.context-menu button:focus-visible{background:var(--navy);color:#fff;outline:none}
.context-menu button:active{padding:4px 16px}
.context-menu button:disabled:hover{color:#808080;background:transparent}
.balloon{position:absolute;right:8px;bottom:42px;width:260px;max-width:calc(100% - 20px);padding:10px 24px 10px 11px;background:#ffffe1;border:1px solid #000;box-shadow:2px 2px 0 #0005;z-index:1150;user-select:none;color:#111;font-size:12px;line-height:1.6}
.balloon::after{content:"";position:absolute;bottom:-7px;right:47px;width:12px;height:12px;background:#ffffe1;border-right:1px solid #000;border-bottom:1px solid #000;transform:rotate(45deg)}
#balloon-title{font-weight:bold;margin-bottom:3px}
.balloon-close{position:absolute;right:5px;top:5px;width:17px;height:17px;min-height:17px;padding:0;font:bold 12px Tahoma,sans-serif;line-height:12px}
.balloon-close:active{padding:0}
.modal-shade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0002;z-index:2000;padding:12px;pointer-events:auto}
.dialog{width:375px;max-width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--face);border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,2px 2px 0 #0006;padding:3px}
.dialog-body{padding:18px 15px 10px;line-height:1.7;user-select:text;overflow:auto;min-height:0}
.dialog-body p{margin:0 0 10px}
.dialog-body svg{width:34px;height:34px;flex:none}
.dialog-buttons{display:flex;justify-content:center;gap:9px;padding:10px 12px 14px;flex-wrap:wrap}
.dialog-buttons button{min-width:80px}
.dialog-footer{padding:4px 9px 7px;color:#444;font-size:11px;line-height:1.6;border-top:1px solid #808080;box-shadow:inset 0 1px #fff;user-select:text}
.mail-ui{height:100%;display:grid;grid-template-columns:125px minmax(0,1fr);gap:4px;padding:4px;min-height:0}
.mail-tree{padding:8px 3px;font-size:12px;line-height:22px;overflow:auto;user-select:none}
.tree-row{display:flex;align-items:center;gap:5px;white-space:nowrap;padding:1px 4px;min-height:24px}
.tree-row svg{width:16px;height:16px}
.tree-selected{background:var(--navy);color:#fff}
.mail-main{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
.mail-list{flex:0 0 132px;overflow:auto;min-height:79px}
.mail-cols{display:grid;grid-template-columns:minmax(0,1fr) 105px 58px;background:var(--face);height:22px;position:sticky;top:0;z-index:1;box-shadow:0 1px #808080;user-select:none}
.mail-cols span{padding:3px 6px;border:1px solid;border-color:#fff #808080 #808080 #fff;white-space:nowrap;overflow:hidden}
button.mail-row{display:grid;grid-template-columns:minmax(0,1fr) 105px 58px;align-items:center;width:100%;min-height:25px;padding:4px 3px;background:#fff;border:0;box-shadow:none;text-align:left;line-height:17px;font-size:12px}
.mail-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.mail-row svg{width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:4px}
button.mail-row.active{background:var(--navy);color:#fff}
button.mail-row.unread{font-weight:bold}
button.mail-row:active{padding:4px 3px}
button.mail-row:focus-visible{outline:1px dotted currentColor;outline-offset:-2px}
.mail-preview{flex:1;min-height:0;overflow:auto;background:#fff;display:flex;flex-direction:column}
.mail-head{padding:8px 10px;background:#eee;border-bottom:1px solid #808080;line-height:1.6;word-break:break-word;flex:none}
.mail-head strong{font-weight:bold}
.mail-head p{margin:1px 0}
.mail-body{padding:15px 15px 8px;line-height:1.9;white-space:pre-wrap;word-break:break-word;flex:1}
.mail-body p{margin:0 0 9px}
.mail-reply{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid #c0c0c0;margin:0 10px;padding:10px 0;flex:none}
.mail-reply input{flex:1;min-width:80px}
.mail-reply label{width:100%;font-weight:bold}
.mail-reply button{flex:none}
.feedback{display:block;width:100%;line-height:1.6;min-height:17px;color:#800000;font-size:12px}
.feedback.ok,.feedback.success{color:#006000}
.mail-empty{padding:16px;color:#555;line-height:1.8}
.folder-view{background:#fff;min-height:100%;padding:15px 12px;display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:12px;user-select:none}
.file-item{width:89px;min-height:75px;background:none;border:0;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;text-align:center;font-size:12px;color:#000}
.file-item svg{width:34px;height:34px}
.file-item span{display:block;max-width:100%;padding:2px 3px;line-height:17px;word-break:break-word;border:1px solid transparent}
.file-item:active{padding:4px 2px;background:none;box-shadow:none;border:0}
.file-item.selected span,.file-item.active span,.file-item[aria-selected="true"] span{background:var(--navy);color:#fff;border:1px dotted #fff}
.file-item:focus-visible{outline:none}
.file-item:focus-visible span{border:1px dotted #000}
.file-info{width:100%;color:#666;font-size:12px;line-height:1.7;padding:8px 3px;border-top:1px solid #ddd;user-select:text}
.auth{display:flex;align-items:flex-start;gap:16px;padding:20px 16px;line-height:1.7}
.auth>svg,.auth>.auth-icon svg{width:40px;height:40px;flex:none;margin-top:3px}
.auth-content{flex:1;min-width:0}
.auth-content p{margin:0 0 10px}
.auth-content input{width:100%;max-width:240px}
.auth-content label{display:block;margin-bottom:4px}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:11px}
.actions button{min-width:76px}
pre.notepad{margin:0;min-height:100%;padding:9px 10px;background:#fff;color:#000;font:14px/1.75 "Courier New","宋体",SimSun,monospace;white-space:pre-wrap;word-break:break-word;user-select:text;cursor:text;tab-size:4}
.photo-view{min-height:100%;background:#808080;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:11px}
.photo-image{width:320px;max-width:100%;aspect-ratio:320/230;position:relative;flex:none;background:#ded8c9;border:9px solid #e7e1d0;border-bottom-width:20px;box-shadow:3px 3px 0 #0005;overflow:hidden;user-select:none}
.photo-image>svg{width:100%;height:100%;shape-rendering:auto}
.photo-back{width:100%;height:100%;background:#e3dcc7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;color:#3b3930;text-align:center;font:15px/1.8 "楷体",KaiTi,"宋体",SimSun,serif;user-select:text}
.photo-caption{color:#fff;line-height:1.6;text-align:center}
.photo-view .actions{justify-content:center;margin-top:0}
.help-body{padding:15px 18px;background:#ffffe1;line-height:1.8;min-height:100%;color:#111}
.help-body h2{font-size:15px;line-height:1.6;margin:0 0 12px}
.help-body h3{font-size:13px;margin:14px 0 6px}
.help-body p{margin:0 0 9px}
.help-body ul,.help-body ol{padding-left:22px;margin:5px 0 12px}
.help-body li{margin-bottom:5px}
.help-body kbd{display:inline-block;min-width:18px;text-align:center;font:11px Tahoma,sans-serif;padding:1px 4px;background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff}
.screen-caption{margin-top:28px;color:#b2ada6;font:11px/1.6 Tahoma,"宋体",SimSun,sans-serif;letter-spacing:.3px;text-align:center}
#screen:fullscreen{width:100vw;height:100vh;min-height:0;max-height:none;border:0;border-radius:0;box-shadow:none;background:var(--teal)}
#screen:fullscreen #workspace{inset:0 0 33px}
#screen:fullscreen::after{box-shadow:inset 0 0 24px #0005}
@media(max-width:760px){
  .room{padding:12px 10px 22px;justify-content:flex-start}
  .monitor{padding:8px 8px 0;border-radius:10px;margin-top:8px}
  .bezel{padding:16px 14px 18px;border-radius:6px}
  #screen{height:calc(100svh - 133px);min-height:360px;border-width:5px;border-radius:3px}
  .monitor-brand{margin:12px 0 13px 12px;font-size:11px;letter-spacing:1.8px}
  .vents{bottom:18px;left:45%;width:15%;height:10px}
  .power{right:21px;bottom:11px;gap:8px}
  .power-button{width:24px;height:21px;min-height:21px}
  .os-mark{right:25px;bottom:26px;font-size:32px}
  .mail-ui{grid-template-columns:minmax(0,1fr)}
  .mail-tree{display:none}
  .mail-list{flex-basis:113px}
  .mail-body{padding:10px 11px 6px;line-height:1.8}
  .mail-cols,button.mail-row{grid-template-columns:minmax(0,1fr) 80px 48px}
  .toolbar{gap:3px;padding:4px 3px}
  .toolbar button{padding-left:5px;padding-right:5px}
  .screen-caption{margin-top:22px}
}
@media(max-width:480px){

    ['合照里的灯比孩子多一盏。查看照片背面，再到桌边找节日卡片。','只读门廊四盏亮灯，从左到右：尖牙、笑脸、星眼、锯齿。','节日卡片对应数字为 4、1、7、3。文件夹密码：4173。'],
    ['抽屉里保存着四张糖纸和一份派糖记录。','派糖顺序是蝙蝠、女巫、黑猫、幽灵，分别取糖纸上的字。','拼成「先问糖给谁」。在抽屉中提交这五个字，然后前往回收站。'],
    ['日记有三个版本。不要仅依赖修改时间。查看墙上日历、合照和家庭录像。','可信版本必须同时符合：零点前停电、哥哥左袖沾泥、七根蜡烛。','选择版本 B：23:54停电，哥哥左袖沾泥，小满七岁生日。'],
    ['打开录音机。排好四段声音，之后使用抽屉里的离线卡片。','街上游行→午夜钟声→三次敲门→停电寂静。若主卡已发送，使用备用封条。','录音顺序：C、A、D、B。验证后对照纸质答案，选择匹配的邮件。'],
    ['线索板上的日记、邀请卡与灯具维修记录共同解释仪式。','名字对应被邀请者；位置决定归属；灯光决定可见的一边。','三个选择依次为：被邀请者、归属、可见的一边。'],
    ['安全结局可撤销邀请。救人需要正式姓名、门槛外的灯与最后的迎接。','正式姓名在出生纪念卡；完整脱离还需要维修记录、定时插座及最后一封警告。','填写「林望舒」，把灯移到门槛外。若要完整脱离：读维修记录、设置插座、写回信，再迎接。']
  ],
  mails: [
    {id:'first',stage:0,title:'先别相信我',time:'00:13',body:'零点之后，会有人敲三次门。\n它会用小满的声音叫你。不要回答她的名字。\n\n先找到那张合照。数一数灯，再看照片背面。母亲的节日卡片放在桌边。\n\n如果下一封信告诉你开门，请先确认：那封信，是不是我写的。'},
    {id:'opened',stage:1,title:'你打开了那个文件夹',time:'00:13',body:'很好。你没有把那盏没亮的灯算进去。\n\n我经历过这一步，所以知道你会找到它。也可能你以为我是这样知道的。\n\n母亲把日记删掉了。在恢复之前，先找她留下的糖纸。'},
    {id:'door',stage:1,title:'门外留言：我忘了带钥匙',time:'00:00',body:'哥哥，外面好冷。\n\n你还记得我叫什么吗？回复名字就好，我想知道你有没有忘了我。\n\n你说出名字后，我才知道自己该去哪个位置。'},
    {id:'deleted',stage:2,title:'别只相信修改时间',time:'00:13',body:'回收站里有三个同名文件。被改变过的记忆也会留下记录。\n\n用房间里的实物去核对它们。日历、照片、家庭录像。\n\n不要把「最近修改」误当成「真实发生」。'},
    {id:'a',stage:3,title:'A / 核对本轮来信',time:'00:13',body:'先核对母亲留在抽屉里的纸质证据。只寄出问题，答案留在本地。'},
    {id:'b',stage:3,title:'B / 核对本轮来信',time:'00:13',body:'先核对母亲留在抽屉里的纸质证据。只寄出问题，答案留在本地。'},
    {id:'truth',stage:4,title:'我没有告诉你的事',time:'00:13',body:'小满还在那里。她已经等了十三年。\n\n撤销邀请，你可以活着离开；更正邀请，她才有机会回来。\n\n如果选择救她，需要有人留下，把警告送给23:57的自己。我没有告诉你，因为我怕你会放弃。\n\n但母亲留下了维修记录。或许她找到过另一条路。'},
    {id:'last',stage:5,title:'别让它知道你发现了',time:'00:13',body:'名字、位置、灯光。三者一起决定门将为谁打开。\n\n请确认的是她真正的姓名，不是门外已经占用的昵称。\n\n如果你仍然决定救她，最后再按下迎接。你还有一次撤回的机会。'},
    {id:'chair',stage:1,title:'空着的那把椅子',time:'00:13',body:'你还记得派对结束后那把空椅子吗？母亲收走了每个孩子的碗，却给它留了一颗糖。\n\n小满问为什么。母亲说，节日里，总要给没有来的人留个位置。\n\n后来，那个位置一直没有撤掉。门外的声音每一年都来，像在等我们说出一句它需要的话。\n\n别急着补全访客名单。请先读母亲没有寄出去的笔记。'},
    {id:'versions',stage:2,title:'最近修改，不等于真的发生',time:'00:13',body:'三份记录看起来都出自同一个人。先核对每条细节；排列、编号和修改时间都不能单独证明真实性。\n\n母亲在日记里圈过两个词：核对。记忆会被重新叙述，实物仍会留下不合时宜的痕迹。\n\n你需要墙上的日历、照片背面和那段七岁生日录像。收录它们之后，再恢复日记。'},
    {id:'channel',stage:3,title:'两封信共用同一条线',time:'00:13',body:'你可能想，挑一封信寄过去就安全了。不是这样的。\n\n它们共用母亲留下的通信通道。你发送的照片和家庭录像摘要，会同时成为门外能学到的材料。\n\n验证卡也是如此。一旦寄出，正确答案就不再证明身份。备用封条没有发送按钮，请把它留在抽屉里。'},
    {id:'mother',stage:4,title:'她留下的第二种断电',time:'00:13',body:'我一开始以为必须有人留下。母亲的最后一页却写着：先排队，后断电。\n\n电脑里的时间可能被改写。桌边的机械插座独立运转，只会在最后一封邮件发出之后切断装置。\n\n她为什么没有试？维修记录停在十三年前的11月1日，没有留下答案。\n\n你可以继续调查，也可以撤销。她的研究不应该替你做决定。'}
  ],

    photo:{name:'十三年前的合照',text:'十二个孩子、十三盏灯。门廊亮灯：尖牙→笑脸→星眼→锯齿。哥哥左袖沾泥。门槛内兔耳灯熄灭。'},
    card:{name:'节日卡片',text:'灯脸数字：尖牙4 / 笑脸1 / 星眼7 / 锯齿3。密码只看门廊亮灯，从左向右。'},

    calendar:{name:'母亲的日历',text:'十三年前10月31日：23:54停电。备用灯亮了六分钟；午夜钟声响起，三次敲门，备用灯也熄灭。'},
    video:{name:'家庭录像',text:'七根蜡烛。妹妹说：第一颗糖给没来的那个人。哥哥刚从院子回来，左袖都是泥。'},

    repair:{name:'灯具与通信装置维修记录',text:'兔耳灯移至门槛外，照亮被留下的人。警告先进入发送队列；机械插座在00:13发送结束后断电，阻止下一轮连接。'},
    invitation:{name:'旧邀请卡',text:'命名→留位→迎接。撤销能关闭仪式；更正需要真实身份与正确灯位。迎接前可以撤回。'}

 {id:'returning',stage:0,title:'你把椅子挪回去了',time:'00:13',body:'回来时，你是不是先把桌边的椅子往里推了一下？\n\n我也这样做过。总觉得椅子放在那里，是有人刚刚起身，却还没走远。\n\n这间屋子里有太多熟悉的东西。熟悉会让人放松，也会让人错认。先看纸上留下的痕迹，再听门外怎么说。'},
 {id:'wrong-memory',stage:2,title:'有些记忆太顺了',time:'00:13',body:'我一开始也选了最新的日记。里面每句话都像我亲眼见过的，读完之后，我甚至想不起自己为什么怀疑。\n\n后来我发现，照片里那块泥，和文字写的不是同一边。\n\n请把几份记录放在一起。不要只选让你舒服的那个版本。哪怕它写着你最想听见的话。'},
 {id:'last-chair',stage:4,title:'这次留给你自己判断',time:'00:13',body:'我很想告诉你，只要照我说的做，就能把一切恢复。\n\n但我已经用这种说法骗过你一次：没有告诉你，自己为什么要留下。\n\n母亲留下的东西都还在屋里。你可以核对，可以回来问，也可以决定到此为止。被验证是真的那个人，也不该替你做完最后的选择。'}
);
STORY.mails.sort((a,b)=>a.stage-b.stage);

STORY.endings.visitor.body+='\n\n电脑前的面具慢慢转向门口。\n「这次，换你去敲门。」';
STORY.endings.sacrifice.body+='\n\n「哥哥，你不一起走吗？」\n你看了一眼仍亮着的屏幕。\n「我还要寄一封信。」';
STORY.endings.free.body+='\n\n她拉了拉你的衣袖，像十三年前一样。\n「哥哥，天亮了。」\n你把椅子推回桌边，和她一起离开了房间。';

function openApp(id){hideMenus();if(wins.has(id)){activate(id);return}const def=apps[id],area=$('workspace'),w=Math.min(def.w,area.clientWidth-12),h=Math.min(def.h,area.clientHeight-12),count=wins.size;const el=document.createElement('section');el.className='window';el.dataset.window=id;el.setAttribute('aria-label',def.name);el.setAttribute('role','region');el.style.cssText='width:'+w+'px;height:'+h+'px;left:'+clamp(Math.max(108,(area.clientWidth-w)/2)+count*18,0,area.clientWidth-w)+'px;top:'+clamp(24+count*22,0,area.clientHeight-h)+'px';el.innerHTML='<div class="titlebar"><span class="title-icon">'+icons[def.icon]+'</span><span class="titletext">'+def.name+'</span><div class="win-controls"><button data-control="min" aria-label="最小化窗口">_</button><button data-control="max" aria-label="最大化窗口">□</button><button data-control="close" aria-label="关闭窗口">×</button></div></div><div class="menu"></div><div class="toolbar"></div><div class="window-content"></div><div class="statusbar"><span class="status"></span><span>NIGHT/OS 98</span></div><div class="resize-grip" aria-hidden="true"></div>';$('windows').append(el);const win={id,el,min:false,max:false,saved:null};wins.set(id,win);el.addEventListener('pointerdown',()=>{if(active!==id)activate(id)});el.querySelector('[data-control="min"]').onclick=()=>minimize(id);el.querySelector('[data-control="max"]').onclick=()=>maximize(id);el.querySelector('[data-control="close"]').onclick=()=>closeApp(id);el.querySelector('.titlebar').ondblclick=e=>{if(!e.target.closest('button'))maximize(id)};el.oncontextmenu=e=>{e.preventDefault();context(e,[['最小化',()=>minimize(id)],['最大化 / 还原',()=>maximize(id)],['关闭窗口',()=>closeApp(id)]])};makeWindowDraggable(win);renderApp(id);activate(id);if(window.innerWidth<=700){win.saved={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};win.max=true;win.el.classList.add('maximized');fitWindow(win)}}
function makeWindowDraggable(win){let drag=null;const bar=win.el.querySelector('.titlebar'),grip=win.el.querySelector('.resize-grip');bar.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button')||win.max)return;drag={kind:'move',x:e.clientX,y:e.clientY,left:parseFloat(win.el.style.left),top:parseFloat(win.el.style.top)};bar.setPointerCapture(e.pointerId)});grip.addEventListener('pointerdown',e=>{if(e.button!==0||win.max)return;drag={kind:'resize',x:e.clientX,y:e.clientY,w:win.el.offsetWidth,h:win.el.offsetHeight};grip.setPointerCapture(e.pointerId)});const move=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,area=$('workspace');if(drag.kind==='move'){win.el.style.left=clamp(drag.left+dx,0,area.clientWidth-win.el.offsetWidth)+'px';win.el.style.top=clamp(drag.top+dy,0,area.clientHeight-win.el.offsetHeight)+'px'}else{win.el.style.width=clamp(drag.w+dx,Math.min(310,area.clientWidth),area.clientWidth-parseFloat(win.el.style.left))+'px';win.el.style.height=clamp(drag.h+dy,Math.min(240,area.clientHeight),area.clientHeight-parseFloat(win.el.style.top))+'px'}};for(const control of [bar,grip]){control.addEventListener('pointermove',move);control.addEventListener('pointerup',()=>drag=null);control.addEventListener('pointercancel',()=>drag=null)}}

<script>
'use strict';
const SYMBOL_POOL=['月亮','黑猫','钥匙','南瓜','蜡烛','乌鸦','铃铛','兔子'];
function shuffledSymbols(){const arr=[...SYMBOL_POOL];for(let i=arr.length-1;i>0;i--){const n=Math.floor(Math.random()*(i+1));[arr[i],arr[n]]=[arr[n],arr[i]]}return {primary:arr.slice(0,4),backup:arr.slice(4)}}
function validCards(cards){return cards&&['primary','backup'].every(k=>Array.isArray(cards[k])&&cards[k].length===4&&cards[k].every(v=>SYMBOL_POOL.includes(v)))&&new Set([...cards.primary,...cards.backup]).size===8}
function migrateSaved(s){if(!s||s.version!==1||!Number.isInteger(s.chapter)||s.chapter<0||s.chapter>5||!Array.isArray(s.clues)||!Array.isArray(s.exposed))return null;const base=fresh();const out={...base,chapter:s.chapter,clues:s.clues.filter(k=>Object.hasOwn(STORY.evidence,k)),exposed:s.exposed.filter(k=>Object.hasOwn(STORY.evidence,k)||k==='nickname'),notes:typeof s.notes==='string'?s.notes:'',end:Object.hasOwn(STORY.endings,s.end)?s.end:null};for(const k of ['named','reserved','verified','timer','queued'])out[k]=s[k]===true;out.lamp=s.lamp==='outside'?'outside':'inside';out.hints=Object.fromEntries(Object.entries(s.hints||{}).filter(([k,v])=>/^[0-5]$/.test(k)&&Number.isInteger(v)&&v>=0).map(([k,v])=>[k,Math.min(v,3)]));out.cards=validCards(s.cards)?s.cards:{primary:['月亮','黑猫','钥匙','南瓜'],backup:['蜡烛','乌鸦','铃铛','兔子']};out.settings={...base.settings,...(s.settings&&typeof s.settings==='object'?s.settings:{})};out.settings.volume=Number.isFinite(out.settings.volume)?Math.min(1,Math.max(0,out.settings.volume)):.5;for(const k of ['sound','largeText','calm'])out.settings[k]=out.settings[k]===true;for(const k of ['ambience','captions'])out.settings[k]=out.settings[k]!==false;out.drafts=s.drafts&&typeof s.drafts==='object'?s.drafts:{};out.read=Array.isArray(s.read)?s.read.filter(k=>STORY.mails.some(m=>m.id===k)):[];out.warning=typeof s.warning==='string'?s.warning:'';out.board=normalizeBoardState(s.board);out.enhancement=normalizeEnhancement(s.enhancement);out.verificationRun=normalizeVerificationRun(s.verificationRun,s);out.puzzleRun=normalizePuzzleRun(s.puzzleRun);out.verificationProof=s.verified&&s.verificationProof?JSON.parse(JSON.stringify(s.verificationProof)):null;out.challenge=['primary','backup'].includes(s.challenge)?s.challenge:null;out.answers=s.answers&&SYMBOL_POOL.includes(s.answers.a)&&SYMBOL_POOL.includes(s.answers.b)?{a:s.answers.a,b:s.answers.b}:null;return out}

function evidenceText(id){if(id==='photo')return '十三年前的合照。背面提示只读门廊四盏亮灯，不数人。可回相册放大观察刻纹与衣袖，或展开辅助文字说明。';if(id==='diary')return '本局已核对的备份为 '+diaryCorrectLabel()+'。'+STORY.evidence.diary.text;if(id==='recording')return '本局顺序：'+recordingCorrectOrder().split('').join('→')+'。游行、钟声、敲门、寂静。它看不到未发送的纸质证据；位置决定归属，灯光决定哪一边可见。';if(id==='verification')return '主卡：'+state.cards.primary.join('、')+'。备用封条：'+state.cards.backup.join('、')+'。主卡问题：'+verificationQuestion('primary')+' 备用封条问题：'+verificationQuestion('backup')+' 只发送问题，答案留在本地。';return STORY.evidence[id].text}

function journalPanel(){return paper('母亲的未寄出笔记','<p class="muted">这些纸页从未进入通信通道。</p><h3>十月二十八日 · 空椅子</h3><blockquote>今天收拾餐桌，我又摆了三个碗。邻居笑我记性不好。我说不是三个，是四个。<br><br>我忘了为什么要说四个，直到看见柜子里那只兔子面具。孩子们那晚给一个不存在的人留下了位置。它占据了小满的名字，却没带走我们给陌生人留下的那把椅子。</blockquote><p>夹在笔记里的派对清单：十三盏灯，十二副面具，一把空椅子。小满不肯戴面具，说那样哥哥会认不出她。</p>'+(state.chapter>=3?'<h3>十月三十日 · 不要替我记忆</h3><blockquote>昨晚有人敲门，声音和她一模一样。我问她第一颗糖给谁，她没有回答。<br><br>第二晚，我寄出了录像。第三晚，她答对了。<br><br>我差一点把这当成她回来的证据。可她只是学会了录像里的那句话。我不能再用已经寄出去的东西验证她。</blockquote>':'<p class="muted">其余纸页暂时与日记一起锁着。恢复可信备份后可继续阅读。</p>')+(state.chapter>=4?'<h3>十月三十一日 · 最后一次实验</h3><blockquote>机器不是每个午夜都能寄信。它只连接同一夜的23:57和00:13。停留在那里的人会重复这十六分钟。<br><br>要关掉机器，不能先关电。过去的你需要那封警告，才会走到这里。<br><br>先排队，后断电。机械插座独立工作，门外改变电脑时钟也碰不到它。</blockquote><p>最后一页只剩一个压得很深的字：回。</p>':''))}
function helpPanel(){return paper('操作帮助与待完善项','<p>电脑上双击图标，或选中后按回车；手机单击打开。开始菜单可打开全部程序。右下角「查看房间」进入书房，点击物品调查；「返回电脑桌面」回到电脑。开始菜单也可打开家庭档案等程序。底部任务栏可横向滚动切换窗口。</p><p>时钟跟随剧情前进，不限制阅读。提示分为三个层次。发送附件前会确认；发送后的信息会被门外学习。收录按钮把已看见的线索保存在证据板中。新证据先排在左侧，拖动纸片调整位置；拖动圆点或依次点击两个圆点连线。选择连线后可删除，误操作可撤销，位置和连线自动存档。「整理到左侧」只调整纸片，保留连线；清空连线前会确认。开始菜单与章节栏可打开调查清单，或导出与恢复调查存档。</p><p>输入草稿、离线笔记、已读邮件、声音及阅读设置会自动保存。当前浏览器禁止存储时，会明确显示无法存档。</p><h3>当前调查</h3><p>'+objective()+'</p>'+btn('查看分层提示','hint')+' '+btn('阅读与声音','settings')+'<h3>本轮已优化</h3><p>房间物品与猫眼插画、南瓜灯位置反馈、四种结局画面、录音环境试听、音量与大字设置、每局随机的真假来信与纸面问题、随机日记与录音编号、纸面依据核对、异常存档保护、渐进时间线、结局收藏、输入草稿、旧存档兼容、已读记录与手机切换。</p><h3>需要后期完善</h3><p>① 人物对白目前仍用字幕，真人配音与完整环境音素材待制作。<br>② 家庭录像以文字摘要呈现，角色动画与完整结局演出待制作。<br>③ 已补充来信和母亲笔记，但45～60分钟目标仍需真实试玩确认，不能仅凭内容量保证。<br>④ 线索板已支持自由拖拽、圆点连线、撤销与布局保存；真实触屏设备的长时间操作仍需人工试玩。<br>⑤ 手机已支持单击与窗口铺满，跨设备、旧浏览器及屏幕阅读器还需人工试玩。</p><p class="muted">本游戏可离线运行，不使用网络邮箱，不发送真实个人资料。</p>')}

<script>
'use strict';
const SaveGuard={blocked:false,reason:'',damaged:null,backup:null,lastBackup:0};
function parseProtectedSave(raw){
 if(typeof raw!=='string'||!raw)return null;
 try{const source=JSON.parse(raw);if(!source||source.cards&&!validCards(source.cards)||source.verificationRun&&!validVerificationRun(source.verificationRun)||source.puzzleRun&&!validPuzzleRun(source.puzzleRun))return null;return migrateSaved(source)}catch{return null}
}
function preserveDamagedSave(raw){
 SaveGuard.damaged=raw;
 try{const previous=localStorage.getItem(SAVE_KEY+'-damaged');if(previous===null||previous===raw)localStorage.setItem(SAVE_KEY+'-damaged',raw);else localStorage.setItem(SAVE_KEY+'-damaged-latest',raw)}catch{}
}
function loadProtectedProgress(){
 try{
  const raw=localStorage.getItem(SAVE_KEY),backupRaw=localStorage.getItem(SAVE_KEY+'-last-good');
  SaveGuard.backup=parseProtectedSave(backupRaw)?backupRaw:null;
  if(raw===null){if(SaveGuard.backup){SaveGuard.blocked=true;SaveGuard.reason='主存档缺失，但找到了上一份有效进度。'}return null}
  const loaded=parseProtectedSave(raw);if(loaded)return loaded;
  preserveDamagedSave(raw);SaveGuard.blocked=true;SaveGuard.reason='当前浏览器存档无法完整读取。原始内容已保留，暂不覆盖它。';return null;
 }catch{SaveGuard.blocked=true;SaveGuard.reason='浏览器暂时不允许读取存档。可以临时调查并导出进度，或稍后重新读取。';return null}
}
function writeProtectedProgress(){
 state.read=[...readMails];
 if(SaveGuard.blocked){saveAvailable=false;$('save-status').textContent='原存档待恢复 · 暂未覆盖';return}
 try{
  const raw=JSON.stringify(state),previous=localStorage.getItem(SAVE_KEY),old=parseProtectedSave(previous),now=Date.now();
  if(previous&&!old)preserveDamagedSave(previous);
  try{
   const candidate=old&&(now-SaveGuard.lastBackup>15000||old.chapter!==state.chapter)?previous:null;
   if(candidate||localStorage.getItem(SAVE_KEY+'-last-good')===null){const checkpoint=candidate||raw;localStorage.setItem(SAVE_KEY+'-last-good',checkpoint);SaveGuard.backup=checkpoint;SaveGuard.lastBackup=now}
  }catch{}
  localStorage.setItem(SAVE_KEY,raw);saveAvailable=true;
 }catch{saveAvailable=false}
 $('save-status').textContent=saveAvailable?'进度已保存在此浏览器':'当前浏览器无法存档';
}
function downloadDamagedSave(){
 const raw=SaveGuard.damaged;if(raw===null)return;
 const url=URL.createObjectURL(new Blob([raw],{type:'text/plain;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='午夜来信-损坏存档原始内容.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function restoreProtectedCheckpoint(){
 const recovered=parseProtectedSave(SaveGuard.backup);if(!recovered)return;
 for(const id of [...wins.keys()])closeApp(id);
 state=recovered;readMails.clear();state.read.forEach(id=>readMails.add(id));selectedMail=0;photoBack=false;
 SaveGuard.blocked=false;SaveGuard.reason='';hasSavedGame=true;closeDialog();applySettings();save();switchScene('desktop',false);updateState();boot(true);
}
function startAfterSaveDamage(){
 // This is an explicit choice in the recovery dialog; ordinary saves never release the guard.
 SaveGuard.blocked=false;SaveGuard.reason='';reset(true);
}
function showSaveRecovery(){
 const backup=parseProtectedSave(SaveGuard.backup),buttons=[];
 if(backup)buttons.push({label:'恢复上一份有效进度',fn:restoreProtectedCheckpoint});
 if(SaveGuard.damaged!==null)buttons.push({label:'导出损坏原始内容',fn:downloadDamagedSave});
 buttons.push({label:'选择导出的存档文件',fn:()=>{closeDialog();openApp('progress')}});
 buttons.push({label:'临时调查，不覆盖原档',fn:()=>{closeDialog();openApp('guide')}});
 buttons.push({label:'保留副本并重新开始',fn:()=>showDialog('确认重新开始','<p>将开始新的调查。损坏的原始内容仍保留为副本，已有结局收藏保留。</p><p>也可以返回，继续尝试恢复上一份有效进度。</p>',[{label:'开始新的调查',fn:startAfterSaveDamage},{label:'返回恢复选项',fn:showSaveRecovery}],false)});
 showDialog('调查存档需要恢复','<div class="save-recovery"><h2>先把这一夜留下来</h2><p>'+h(SaveGuard.reason)+'</p>'+(backup?'<p>可恢复：第'+(backup.chapter+1)+'章 · '+h(STORY.chapters[backup.chapter])+'，'+backup.clues.length+' 条证据。</p>':'<p>暂未找到可用的自动检查点。若曾导出 JSON，可以选择文件恢复。</p>')+'<p class="muted">临时调查不会覆盖原存档。需要保留临时进度时，可从开始菜单导出。</p></div>',buttons,false);
 $('modal').querySelector('.dialog').classList.add('save-recovery-dialog');
}

 }
 if(id==='mail'){
  const reading=win.el.querySelector('.mail-body');reading?.classList.add('mail-reading-polish');
 }
}
const originalEnhanceRender=renderApp;
renderApp=function(id){originalEnhanceRender(id);enhanceWindow(id)};
const originalEnhanceClue=clue;
clue=function(id){const isNew=!state.clues.includes(id);originalEnhanceClue(id);if(isNew){recordInvestigation('evidence-'+id,'收录了「'+STORY.evidence[id].name+'」。');playFoley('paper')}};
const originalEnhanceAdvance=advance;
advance=function(n,title,text){
 const before=state.chapter;originalEnhanceAdvance(n,title,text);
 if(state.chapter!==before){recordInvestigation('chapter-'+state.chapter,'调查进入「'+STORY.chapters[state.chapter]+'」。');chapterNotice();syncEnhancementVisuals()}
};
const originalEnhanceAction=action;
action=function(a){
 const before={chapter:state.chapter,lamp:state.lamp,timer:state.timer,queued:state.queued,end:state.end};
 let conversation=null;if(!state.end&&state.chapter>0&&Object.hasOwn(DOOR_PLAYER_LINES,a)){conversation={chapter:state.chapter,action:a,player:DOOR_PLAYER_LINES[a],text:doorReply(a)[1]}}
 if(a==='sound-knock'){if(!sound){state.settings.sound=true;applySettings();save()}soundCaption('门外 · 三次敲门声试听。')}
 originalEnhanceAction(a);
 if(conversation){const rows=enhancementState().dialogue;rows.push(conversation);state.enhancement.dialogue=rows.slice(-24);recordInvestigation('dialogue-'+a+'-'+state.chapter,a==='name'?'我向门外说出了昵称。这个称呼已经传出去了。':'我与门外的声音交谈，留下了一段记录。');save();if(wins.has('log'))renderApp('log')}
 if(a==='front'||a==='back')playFoley('paper');
 if(state.chapter!==before.chapter&&state.chapter===1)soundCaption('门外 · 咚，咚，咚。三次敲门声。');
 if(state.lamp!==before.lamp){playFoley('lamp');soundCaption(state.lamp==='outside'?'门槛边 · 脚步停下，灯放在门外。':'门槛边 · 兔耳灯被移回房内。');recordInvestigation('lamp-'+state.lamp+'-'+state.chapter,'把兔耳灯移到了'+lampPosition()+'。')}
 if(state.timer&&!before.timer){playFoley('timer');soundCaption('机械插座 · 刻度转动，锁扣轻响。');recordInvestigation('timer','机械插座已设置为00:13断电。')}
 if(state.queued&&!before.queued){playFoley('mail');recordInvestigation('warning','写给23:57自己的警告，已存入发送队列。')}
 syncEnhancementVisuals();
};
const originalEnhanceRoom=showRoom;
showRoom=function(id){
 originalEnhanceRoom(id);playFoley(id==='drawer'?'drawer':id==='door'?'step':id==='desk'||id==='calendar'?'paper':'step');
 if(markInvestigationSeen(id+'-'+state.chapter))recordInvestigation('room-'+id+'-'+state.chapter,'查看了'+({desk:'桌边照片与卡片',drawer:'母亲的抽屉',calendar:'墙上的日历',door:'房门猫眼',lamp:'兔耳南瓜灯'}[id]||'房间物品')+'。');
 syncEnhancementVisuals();
};
const originalEnhanceScene=switchScene;
switchScene=function(scene,focus=true){const changed=scene!==currentScene;originalEnhanceScene(scene,focus);if(changed)playFoley('step');syncNightAudio()};
const originalEnhanceFinish=finish;
finish=function(key){const wasEnded=!!state.end;originalEnhanceFinish(key);if(!wasEnded&&state.end){recordInvestigation('ending-'+key,'这一夜结束了：「'+STORY.endings[key].title+'」。');stopNightAmbience();playFoley('ending');syncEnhancementVisuals()}};
const originalEnhanceReset=reset;
reset=function(...args){
 for(const id of Object.keys(enhancementTimers))clearTimeout(enhancementTimers[id]);$('sound-captions').hidden=true;$('chapter-notice').hidden=true;stopFoley();
 originalEnhanceReset(...args);syncEnhancementVisuals();syncNightAudio();
};
const originalEnhanceSettings=applySettings;
applySettings=function(){originalEnhanceSettings();if($('room-sound'))syncEnhancementVisuals();if(state.settings.captions===false&&$('sound-captions'))$('sound-captions').hidden=true};
function syncEnhancementVisuals(){
 document.body.dataset.nightChapter=String(state.chapter);document.body.dataset.nightEnding=state.end||'';
 const button=$('room-sound');if(button){button.setAttribute('aria-label',sound?'关闭音效':'开启音效');button.setAttribute('aria-pressed',String(sound));button.querySelector('span').textContent=sound?'◖':'○';button.title=sound?'关闭声音':'开启声音'}
 $('room-view').classList.toggle('outside-lamp-light',state.lamp==='outside');
}
function installEnhancements(){
 const controls=document.createElement('div');controls.className='room-controls';const header=$('room-view').querySelector('.room-topbar');controls.append($('toggle-hotspots'));controls.insertAdjacentHTML('beforeend','<button id="room-sound" aria-label="开启音效" aria-pressed="false"><span aria-hidden="true">○</span><small>声音</small></button>');header.append(controls);
 $('room-sound').onclick=()=>{state.settings.sound=!sound;applySettings();save();if(sound)playFoley('click')};
 const air=document.createElement('div');air.className='room-atmosphere';air.setAttribute('aria-hidden','true');air.innerHTML='<div class="moon-haze"></div><div class="floor-warmth"></div>'+Array.from({length:7},(_,i)=>'<i class="room-dust" style="--i:'+i+'"></i>').join('');$('room-stage').append(air);
 $('screen').insertAdjacentHTML('beforeend','<aside id="sound-captions" hidden aria-live="polite"></aside><aside id="chapter-notice" hidden aria-live="polite"></aside>');
 apps.log={name:'调查记录 — 这一夜的足迹',short:'调查记录',icon:'notes',w:640,h:580};
 const logButton=document.createElement('button');logButton.innerHTML=icons.notes+'这一夜的调查记录';logButton.onclick=()=>{hideMenus();openApp('log')};$('start-items').insertBefore(logButton,$('start-items').lastElementChild);
 // Feedback is decorative and never advances time, leaks a clue, or chooses an ending.
 document.addEventListener('pointerdown',event=>{
  if(!event.isTrusted)return;const target=event.target.closest('button');if(!target||target.disabled)return;
  if(target.matches('[data-drawer-item],[data-desk-item]'))playFoley('paper');else if(performance.now()-NightAudio.lastTap>90){NightAudio.lastTap=performance.now();playFoley('click')}
 },true);
 document.addEventListener('keydown',event=>{if(event.isTrusted&&event.key.length===1&&event.target.matches('input:not([type=range]),textarea')&&performance.now()-NightAudio.lastTap>85){NightAudio.lastTap=performance.now();playFoley('key')}},true);
 document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(enhancementTimers.caption);$('sound-captions').hidden=true}syncNightAudio()});
 window.addEventListener('pagehide',()=>{stopFoley();stopNightAmbience()});window.addEventListener('pageshow',syncNightAudio);
 syncEnhancementVisuals();syncNightAudio();
}
installEnhancements();

</script>
<script>installInvestigationTools();installPolishTools();</script>
</body></html>
